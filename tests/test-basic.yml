name: Test buf-breaking basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up minimal buf config and proto file
        run: |
          mkdir -p $GITHUB_WORKSPACE/proto-test
          cat > $GITHUB_WORKSPACE/proto-test/buf.yaml << 'EOF'
          version: v1
          EOF
          cat > $GITHUB_WORKSPACE/proto-test/test.proto << 'EOF'
          syntax = "proto3";
          package test;
          message Foo {
            string name = 1;
          }
          EOF
          git config user.email "test@test.com"
          git config user.name "Test"
          git add $GITHUB_WORKSPACE/proto-test
          git commit -m "add proto files" || true
      - id: action
        uses: .
        with:
          input: proto-test
          against: .git#branch=act-harness,subdir=proto-test
        continue-on-error: true
      - name: Assert results output exists
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          echo "PASS: action ran and produced results output"
